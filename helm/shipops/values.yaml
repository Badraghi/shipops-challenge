# Local milestone only. GitOps will later change the image tag to a unique commit SHA.
replicaCount: 2
image:
  repository: shipops-api
  tag: step1
  pullPolicy: IfNotPresent
service:
  port: 8000
app:
  extraEnv: []
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
database:
  image: postgres:17-alpine
  name: shipops
  authSecret: shipops-db-auth
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 700m
      memory: 512Mi
